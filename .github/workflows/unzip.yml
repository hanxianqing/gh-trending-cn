name: unzip
on:
  push:
    paths:
      - 'gh-trending-cn-src.zip'
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: |
          unzip -o gh-trending-cn-src.zip
          rm gh-trending-cn-src.zip
      - name: Commit extracted files
        run: |
          git config user.name "hanxianqing"
          git config user.email "hanxianqing@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source" || echo "nothing to commit"
          git push
      - name: Remove this workflow
        run: |
          rm .github/workflows/unzip.yml
          git add -A
          git commit -m "Remove unzip workflow" || echo "nothing to commit"
          git push
